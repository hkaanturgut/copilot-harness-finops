name: Agent evals

# Runs the eval gate against the deployed agent. Deploys stay local (azd up);
# CI only needs Foundry User on the project, via OIDC. No secrets or keys.
on:
  pull_request:
    paths: ["azure.yaml", "evals/**", "chat.py", ".github/workflows/evals.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      AGENT_NAME: finops-analyst
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run evals
        env:
          PYTHONUNBUFFERED: "1"
        run: python evals/run_evals.py --workers 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
