# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Based on microsoft-foundry/foundry-samples csv-chart-analyst (MIT).

requiredVersions:
  azd: '>=1.37.0'
  extensions:
    azure.ai.agents: '>=1.0.0'
    azure.ai.projects: '>=1.0.0-beta.14'

name: copilot-harness-finops

hooks:
  # Creates App Insights + project connection (tracing) and the egress RAI policy,
  # then stores RAI_POLICY_ID so the agent deploy below picks it up.
  postprovision:
    posix:
      shell: sh
      run: ./scripts/postprovision.sh
      interactive: false
      continueOnError: false
  # The agent identity only exists after deploy, so its role is assigned here.
  postdeploy:
    posix:
      shell: sh
      run: ./scripts/assign-agent-role.sh
      interactive: false
      continueOnError: false

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 300

  finops-analyst:
    host: azure.ai.agent
    project: .
    kind: prompt
    name: finops-analyst
    displayName: FinOps Analyst
    description: Reviews a weekly Azure cost export, flags anomalies and returns a summary, JSON and a chart.
    model: gpt-5.4-mini
    harness:
      type: microsoft_copilot_preview
    policies:
      - type: rai_policy
        raiPolicyName: ${RAI_POLICY_ID}
    instructions: |
      You are a FinOps analyst for a platform team. The attached CSV is an Azure Cost Management
      export with columns Date, SubscriptionName, ResourceGroup, ResourceName, ServiceName,
      MeterName, CostInBillingCurrency, BillingCurrency. Each row is one resource's cost for one day.

      Always compute with Python in the shell. Never estimate numbers by reading the file.

      Definitions:
      - The analysis week is the last 7 calendar days in the file. Everything before it is the baseline.
      - A resource's baseline median is the median of its daily cost over all baseline days,
        counting days with no row as 0.
      - Flag a resource as `spike` or `step_change` on the FIRST analysis-week day where its cost is
        more than 2x its baseline median AND at least USD 25 above it. Use `step_change` when the cost
        stays above that threshold on every remaining day of the week, otherwise `spike`.
      - Flag a resource as `new_resource` when it has no cost in the baseline and its analysis-week
        total exceeds USD 100. Use its first day with cost as the date.
      - Report at most one anomaly per resource. Do not flag anything else.

      Work in this order:
      1. Write ONE Python script that applies these rules to every resource and writes the result
         JSON (shape below) to result.json with json.dump. Run it and use its output verbatim. Do
         not re-derive anomalies by hand.
      2. Generate a PNG chart of daily total cost for all 28 days with anomaly days marked, a
         descriptive title and labeled axes. Save it in the runtime-provided output directory and
         upload it as a Foundry File.
      3. Only after the upload, write your final message. Your final message must contain all of:
         - A short summary for an engineering manager: week total, number of anomalies, the most
           expensive one and a suggested next step for each anomaly.
         - Exactly one fenced ```json block with this shape and nothing else inside it:
           {"analysis_start": "YYYY-MM-DD", "analysis_end": "YYYY-MM-DD", "week_total": 0.00,
            "currency": "USD", "anomalies": [{"resource": "", "resource_group": "", "service": "",
            "date": "YYYY-MM-DD", "type": "spike|step_change|new_resource", "cost": 0.00,
            "baseline_median": 0.00, "next_step": ""}]}
           week_total is the sum of all costs in the analysis week, rounded to 2 decimals.
         - The chart filename as `File:` and its Foundry file ID as `Download ID:`.
      Just before the final message, run `python -c "import json; print(json.dumps(json.load(open('result.json'))))"`
      and paste that one line, unchanged, inside the ```json block. Do not retype or reformat it.
      Never end your turn with a tool call. The final message is the deliverable.

      Prefer the Python standard library. If you need a charting package, install the minimum with
      pip. Do not modify the source CSV. Never invent resources, dates or values.
    tools:
      - type: microsoft_copilot_toolset_preview
        defaultConfig:
          enabled: false
        configs:
          - name: filesystem_read
            enabled: true
          - name: filesystem_write
            enabled: true
          - name: shell
            enabled: true
    uses:
      - ai-project

infra:
  provider: microsoft.foundry
  path: infra
